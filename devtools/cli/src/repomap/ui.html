<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repo Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a map of every module (each function one cell) on the left, a panel for the change and the
   picked function on the right; cells take the colour of their part in the change. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1b2230; --muted: #5d6676; --line: #dde1e8;
  --accent: #2856c7; --accent-soft: #e5ecfb;
  --chg: #c2410c; --chg-soft: #fbe6da; --l1: #b7791f; --l1-soft: #f6ead2; --l2: #d6b25e;
  --heat: #2856c7; --empty: #c7ccd5; --add: #1f7a4d;
  --un: #c62828; --un-soft: #fbe3e3; --slow: #1b2230; --fast: #b5179e;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151c; --panel: #181d26; --fg: #e3e7ee; --muted: #98a1b2; --line: #2a313d;
  --accent: #7ea2ff; --accent-soft: #1f2a45;
  --chg: #fb8b52; --chg-soft: #3b2216; --l1: #e3b552; --l1-soft: #33290f; --l2: #8f7a3f;
  --heat: #7ea2ff; --empty: #3a4250; --add: #5fcf94;
  --un: #ff6b6b; --un-soft: #3d1c1f; --slow: #e3e7ee; --fast: #f472d0;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151c; --panel: #181d26; --fg: #e3e7ee; --muted: #98a1b2; --line: #2a313d;
  --accent: #7ea2ff; --accent-soft: #1f2a45;
  --chg: #fb8b52; --chg-soft: #3b2216; --l1: #e3b552; --l1-soft: #33290f; --l2: #8f7a3f;
  --heat: #7ea2ff; --empty: #3a4250; --add: #5fcf94;
  --un: #ff6b6b; --un-soft: #3d1c1f; --slow: #e3e7ee; --fast: #f472d0;
  color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; max-width: 1500px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
h1 { font-size: 18px; font-weight: 600; margin: 0; text-wrap: balance; }
h1 span { color: var(--muted); font-weight: 400; }
.stats { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: 1 1 420px; justify-content: flex-end; }
.search { position: relative; flex: 1 1 260px; max-width: 420px; }
.search input { width: 100%; font: 13px var(--sans); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
.search input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px rgb(0 0 0 / .12); max-height: 340px; overflow: auto; }
.results button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: none; padding: 6px 10px; }
.results button:hover, .results button.on { background: var(--accent-soft); }
.results small { color: var(--muted); display: block; font-family: var(--mono); font-size: 11px; }
button { font: 500 13px var(--sans); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 400; text-align: left; }
button.link:hover { text-decoration: underline; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.map { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.pkg { margin-top: 14px; }
.pkg:first-of-type { margin-top: 0; }
.pkg > h3 { font: 500 11.5px var(--mono); color: var(--muted); margin: 0 0 6px; letter-spacing: .02em; }
.mods { display: flex; flex-wrap: wrap; gap: 8px; }
.mod { border: 1px solid var(--line); border-radius: 6px; padding: 6px 7px 7px; min-width: 0; max-width: 100%; }
.mod.hot { border-color: var(--chg); }
.mod.warm { border-color: var(--l1); }
.mod.dim { opacity: .45; }
.mod h4 { margin: 0 0 5px; font: 500 11.5px var(--mono); display: flex; gap: 8px; justify-content: space-between; }
.mod h4 span { color: var(--muted); font-weight: 400; }
.cells { display: grid; grid-template-columns: repeat(var(--cols), 11px); gap: 2px; }
.cell { width: 11px; height: 11px; border-radius: 2px; border: 0; padding: 0; cursor: pointer; background: var(--heat); }
.cell.none { background: transparent; box-shadow: inset 0 0 0 1px var(--empty); }
.cell:hover { outline: 2px solid var(--fg); outline-offset: 0; }
.cell.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
.impact-on .cell { background: var(--empty); opacity: .5; box-shadow: none; }
.impact-on .cell.c0 { background: var(--chg); opacity: 1; }
.impact-on .cell.c1 { background: var(--l1); opacity: 1; }
.impact-on .cell.c2 { background: var(--l2); opacity: 1; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--fg); color: var(--bg); font: 11.5px var(--mono); padding: 4px 7px; border-radius: 4px; max-width: 420px; }
aside { display: flex; flex-direction: column; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow: auto; padding-bottom: 8px; min-width: 0; }
@media (max-width: 980px) { aside { position: static; max-height: none; order: -1; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.card h2 { font-size: 13px; font-weight: 600; margin: 0 0 2px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.big { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 12px; font-variant-numeric: tabular-nums; }
.big div { min-width: 70px; }
.big b { display: block; font-size: 22px; font-weight: 600; line-height: 1.1; }
.big span { color: var(--muted); font-size: 12px; }
.sec { border-top: 1px solid var(--line); padding-top: 9px; margin-top: 10px; }
.sec > h5 { margin: 0 0 6px; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.sec > h5 span { color: var(--muted); font-weight: 400; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); padding: 2px 4px 2px 7px; margin: 0 4px 4px 0; border-radius: 4px; background: var(--chg-soft); max-width: 100%; }
.chip.l1 { background: var(--l1-soft); }
.chip.l2 { background: var(--accent-soft); }
.chip button { border: 0; background: none; padding: 0 3px; color: var(--muted); font-size: 13px; line-height: 1; }
.chip .nm { overflow-wrap: anywhere; cursor: pointer; }
ul.plain { list-style: none; padding: 0; margin: 0; }
ul.plain li { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; font: 12px var(--mono); }
ul.plain li span:first-child { overflow-wrap: anywhere; min-width: 0; }
ul.plain li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.modrow { font-size: 12px; margin-bottom: 5px; }
.modrow b { font: 500 12px var(--mono); }
.modrow .nm { color: var(--muted); font-family: var(--mono); }
pre.cmd { margin: 6px 0 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 11.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 130px; overflow: auto; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note { color: var(--muted); font-size: 12.5px; }
.warn { color: var(--l1); font-size: 12.5px; }
.depth { display: inline-flex; gap: 0; }
.depth button { border-radius: 0; padding: 3px 9px; font-size: 12px; }
.depth button:first-child { border-radius: 5px 0 0 5px; }
.depth button:last-child { border-radius: 0 5px 5px 0; }
.depth button.on { background: var(--accent-soft); border-color: var(--accent); }
.fnkey { font: 500 13px var(--mono); overflow-wrap: anywhere; margin: 6px 0 2px; }
.nb { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px 8px; align-items: center; margin-top: 4px; }
.nb .col { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.nb .col.r { align-items: flex-start; }
.nb .col.l { align-items: flex-end; text-align: right; }
.nb .me { font: 500 12px var(--mono); padding: 5px 8px; border-radius: 5px; background: var(--accent-soft); text-align: center; max-width: 140px; overflow-wrap: anywhere; }
.nb .n { font: 11.5px var(--mono); overflow-wrap: anywhere; max-width: 100%; }
.nb .arrow { color: var(--muted); font-size: 11px; }
table.vals { width: 100%; border-collapse: collapse; font-size: 12px; }
table.vals td { padding: 4px 6px 4px 0; vertical-align: top; border-top: 1px solid var(--line); }
table.vals td:first-child { font-family: var(--mono); white-space: nowrap; }
.gap { color: var(--chg); font-size: 11.5px; }
.tag { font-size: 11px; color: var(--muted); }
.err { color: var(--chg); }
.exlist { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.exlist button { font-size: 12.5px; padding: 4px 9px; }
.exlist button.on { background: var(--accent-soft); border-color: var(--accent); }
pre.diff { margin: 8px 0 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 11.5px/1.5 var(--mono); overflow-x: auto; }
pre.diff .add { color: var(--add); } pre.diff .del { color: var(--chg); }
.verdict { margin: 8px 0 0; font-size: 12.5px; }
.st { font: 500 10.5px var(--sans); text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 3px; }
.st.broke { background: var(--chg-soft); color: var(--chg); }
.st.passed { background: var(--bg); color: var(--muted); }
.viewbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; }
.viewbar .legend { margin: 0; }
.gwrap { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
.gwrap svg { display: block; max-width: 100%; height: auto; }
@media (max-width: 700px) { .gwrap svg { max-width: none; } }
.gwrap .note { margin: 4px 0 8px; }
svg .gh { font: 600 10.5px var(--sans); fill: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
svg .gn rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
svg .gn.k0 rect { fill: var(--chg-soft); stroke: var(--chg); }
svg .gn.k1 rect { fill: var(--l1-soft); stroke: var(--l1); }
svg .gn.k2 rect { fill: var(--panel); stroke: var(--l2); }
svg .gn.kt rect { fill: var(--accent-soft); stroke: var(--accent); }
svg .gn.km rect { fill: none; stroke-dasharray: 3 3; }
svg .gn.untested rect { stroke-dasharray: 4 3; }
svg .gn .t1 { font: 500 11.5px var(--mono); fill: var(--fg); }
svg .gn .t2 { font: 10.5px var(--mono); fill: var(--muted); }
svg .gn .t2 .bk { fill: var(--chg); font-weight: 600; }
svg .gn.fn { cursor: pointer; }
svg .gn.sel rect { stroke: var(--fg); stroke-width: 2; }
svg .ge { fill: none; stroke: var(--l1); stroke-opacity: .7; }
svg .ge.et { stroke: var(--accent); stroke-opacity: .35; }
svg .ge.e0 { stroke: var(--chg); }
svg .ge.es { stroke-dasharray: 5 4; }
svg .gn.pub rect { stroke-width: 2.5; }
svg.fade .gn { opacity: .25; }
svg.fade .ge { stroke-opacity: .08; }
svg.fade .gn.hl { opacity: 1; }
/* readable graph: overview */
.rgbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; margin-bottom: 8px; }
.rgbar label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.rgbar select { font: 12.5px var(--sans); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
.rgbox { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); touch-action: none; }
.rgbox svg { display: block; width: 100%; height: auto; cursor: grab; }
.rgbox svg:active { cursor: grabbing; }
.rf { fill: none; stroke: var(--line); }
.rfl { font: 500 11px var(--mono); fill: var(--muted); pointer-events: none; }
.rfi { fill: var(--panel); stroke: var(--line); stroke-width: .6; }
.rfil { font: 9px var(--mono); fill: var(--muted); pointer-events: none; }
.rc { cursor: pointer; stroke: var(--panel); stroke-width: .5; }
.rc.s0 { fill: color-mix(in srgb, var(--heat) 6%, var(--panel)); }
.rc.s1 { fill: color-mix(in srgb, var(--heat) 22%, var(--panel)); }
.rc.s2 { fill: color-mix(in srgb, var(--heat) 42%, var(--panel)); }
.rc.s3 { fill: color-mix(in srgb, var(--heat) 66%, var(--panel)); }
.rc.s4 { fill: var(--heat); }
.show-un .rc.un { fill: var(--un-soft); stroke: var(--un); stroke-width: 1; stroke-dasharray: 2 1.5; }
.show-pace .rc.fast { stroke: var(--fast); stroke-width: 1.6; }
.show-pace .rc.slow { stroke: var(--slow); stroke-width: 1.6; }
.rc:hover, .rc.sel { stroke: var(--fg); stroke-width: 2; stroke-dasharray: none; }
.rl { pointer-events: none; }
.rl circle { fill: var(--fg); stroke: var(--panel); }
.rl text { font-family: var(--mono); font-weight: 600; fill: var(--fg); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; pointer-events: none; }
.hide-lm .rl { display: none; }
.rlk { fill: none; stroke: var(--muted); stroke-opacity: .35; pointer-events: none; }
.rlk.src { stroke-dasharray: 4 3; }
.rlinks.hovering .rlk { stroke-opacity: .08; }
.rlinks.hovering .rlk.hl { stroke: var(--fg); stroke-opacity: .9; }
.rlk.in { stroke: var(--accent); stroke-opacity: .85; }
.rlk.out { stroke: var(--l1); stroke-opacity: .85; }
.nbmode .rc { opacity: .22; }
.nbmode .rc.me, .nbmode .rc.in, .nbmode .rc.out { opacity: 1; }
.nbmode .rc.me { fill: var(--fg); }
.nbmode .rc.in { fill: var(--accent); }
.nbmode .rc.out { fill: var(--l1); }
.rpmode .rc { opacity: .18; }
.rpmode .rc.run { opacity: .8; fill: var(--empty); }
.rpmode .rc.vis { opacity: 1; fill: color-mix(in srgb, var(--accent) 55%, var(--panel)); }
.rpmode .rc.cur { opacity: 1; fill: var(--chg); stroke: var(--fg); stroke-width: 1.5; }
.rlk.trail { stroke: var(--accent); stroke-opacity: .6; }
.rlk.now { stroke: var(--chg); stroke-opacity: 1; stroke-width: 2.2; }
#rp { margin-top: 10px; display: grid; gap: 8px; }
.rpstep { font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-height: 3.2em; }
.rpstep .call { font: 12px var(--mono); overflow-wrap: anywhere; }
.rpstep .call b { color: var(--chg); font-weight: 600; }
.rpstep .val { color: var(--accent); }
.rpbox { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
#rptree { display: block; width: 100%; min-width: 560px; height: auto; }
.rpb { cursor: pointer; fill: color-mix(in srgb, var(--accent) 18%, var(--panel)); stroke: var(--panel); }
.rpb.vis { fill: color-mix(in srgb, var(--accent) 55%, var(--panel)); }
.rpb.cur { fill: var(--chg); }
.rpb:hover { stroke: var(--fg); }
.rpt { font: 10px var(--mono); fill: var(--fg); pointer-events: none; }
.rpaxis { font: 10.5px var(--sans); fill: var(--muted); }
.rgbar input[list] { font: 12px var(--mono); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; width: min(420px, 100%); }
svg.fade .ge.hl { stroke-opacity: .95; }
@media (prefers-reduced-motion: no-preference) { svg .gn, svg .ge { transition: opacity .12s, stroke-opacity .12s; } }
@media (prefers-reduced-motion: no-preference) { .cell { transition: background-color .15s, opacity .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Repo map</h1>
      <div class="stats" id="stats">Loading the memory…</div>
    </div>
    <div class="tools">
      <div class="search">
        <input id="q" type="search" placeholder="Find a function, or path.py:LINE" autocomplete="off" aria-label="Find a function">
        <div class="results" id="results" hidden></div>
      </div>
      <button id="mine" class="primary" title="Diff the working tree against what the memory traced">My uncommitted changes</button>
      <button id="clear">Clear</button>
    </div>
  </header>
  <div class="grid">
    <section class="map" id="map">
      <div class="viewbar">
        <span class="depth" role="group" aria-label="View"><button data-view="map">Map</button><button data-view="graph">Graph</button></span>
        <span class="depth" id="gsub" role="group" aria-label="Graph view" hidden><button data-gview="overview">Overview</button><button data-gview="neighborhood">Neighborhood</button><button data-gview="replay">Test replay</button><button data-gview="change">Change</button></span>
        <div class="legend" id="legend"></div>
      </div>
      <div id="pkgs"></div>
      <div id="graph" class="gwrap" hidden></div>
      <div id="rg" hidden><div class="rgbar" id="rgbar"></div><div class="rgbox" id="rgbox"></div>
        <div id="rp" hidden><div class="rpstep" id="rpstep"></div><div class="rpbox"><svg id="rptree" role="img" aria-label="The test's calls as a tree: time runs left to right, each row is called by the row above"></svg></div></div></div>
    </section>
    <aside>
      <div class="card" id="examples-card" hidden></div>
      <div class="card" id="impact"></div>
      <div class="card" id="fn" hidden></div>
    </aside>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<script id="embedded" type="application/json"></script>
<script id="examples" type="application/json"></script>
<script src="/static/d3.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
let D, F = [], up = [], down = [], byKey = new Map(), live = true, ekind = new Map(), pub = new Set();
const S = {targets: new Set(), testFiles: [], unknown: [], source: null, depth: 2, sel: null, stale: [], view: null};
let savedView = null, savedGview = null;
try { savedView = localStorage.getItem("repomap.view"); savedGview = localStorage.getItem("repomap.gview"); } catch {}
const PROBES = {str: ["empty"], bytes: ["empty"], list: ["empty"], tuple: ["empty"], dict: ["empty"], int: ["zero", "negative"], float: ["zero", "negative"]};

const file = k => k.split(":")[0];
const qual = k => k.slice(k.indexOf(":") + 1);
const modName = k => file(k).replace(/(\/__init__)?\.py$/, "").replaceAll("/", ".");
const short = k => { const q = qual(k).replace(/\.<locals>\./g, "›"); return q; };

async function boot() {
  const emb = $("#embedded").textContent.trim();
  let changes = null;
  if (emb) { const e = JSON.parse(emb); D = e.data; changes = e.changes; live = false; }
  else {
    try { D = await (await fetch("/api/data")).json(); }
    catch (e) { $("#stats").innerHTML = `<span class="err">Could not reach the repomap server. Start it with <code>repomap serve</code>.</span>`; return; }
    if (D.error) { $("#stats").innerHTML = `<span class="err">${esc(D.error)}</span>`; return; }
  }
  F = D.fns.map(([k, s, e, t], i) => ({i, k, s, e, t, mod: k.endsWith(":<module level>"), v: D.vals[i]}));
  F.forEach(f => byKey.set(f.k, f.i));
  up = F.map(() => []); down = F.map(() => []);
  for (const [a, b] of D.edges) { up[b].push(a); down[a].push(b); }
  // with the code graph: arrows read only from source fill in code no test runs (drawn dashed, counted lower)
  if (D.graph) for (const [src, dst, kind] of D.graph.sedges) {
    up[dst].push(src); down[src].push(dst); ekind.set(src + ">" + dst, kind);
  }
  pub = new Set(D.graph ? D.graph.public : []);
  S.stale = D.stale || [];
  $("#title").innerHTML = `Repo map <span>· ${esc(D.name)}</span>`;
  const tested = F.filter(f => !f.mod && f.t.length).length, total = F.filter(f => !f.mod).length;
  $("#stats").textContent = `${D.tests.length.toLocaleString()} tests · ${tested} of ${total} functions run by a test · ${D.edges.length.toLocaleString()} call edges · traced snapshot ${D.commit}`;
  document.title = `Repo Map · ${D.name}`;
  if (!live) { $("#mine").textContent = "Changes at export"; $("#mine").disabled = !changes; if (!changes) $("#mine").hidden = true; }
  drawMap();
  const exs = $("#examples").textContent.trim();
  S.examples = exs ? JSON.parse(exs) : [];
  if (S.examples.length) { $("#examples-card").hidden = false; useExample(0); }
  else if (changes) applyChanges(changes);
  else if (live) await loadMine(true);
  S.view = savedView === "map" || savedView === "graph" ? savedView : (S.targets.size || S.testFiles.length ? "graph" : "map");
  S.gview = GVIEWS.includes(savedGview) ? savedGview : (S.targets.size || S.testFiles.length ? "change" : "overview");
  render();
}

function drawMap() {
  const pkgs = new Map();
  for (const f of F) {
    const fl = file(f.k), dir = fl.includes("/") ? fl.slice(0, fl.lastIndexOf("/")) : fl;
    if (!pkgs.has(dir)) pkgs.set(dir, new Map());
    const mods = pkgs.get(dir);
    if (!mods.has(fl)) mods.set(fl, []);
    if (!f.mod) mods.get(fl).push(f);
  }
  const max = Math.max(...F.map(f => f.t.length));
  let html = "";
  for (const [dir, mods] of [...pkgs].sort()) {
    html += `<div class="pkg"><h3>${esc(dir)}/</h3><div class="mods">`;
    for (const [fl, fs] of [...mods].sort()) {
      if (!fs.length) continue;
      fs.sort((a, b) => a.s - b.s);
      const cols = Math.min(fs.length, Math.max(6, Math.ceil(Math.sqrt(fs.length * 2.2))));
      const n = new Set(fs.flatMap(f => f.t)).size;
      html += `<div class="mod" data-file="${esc(fl)}"><h4>${esc(fl.slice(fl.lastIndexOf("/") + 1))}<span>${n} tests</span></h4><div class="cells" style="--cols:${cols}">`;
      for (const f of fs) {
        const op = f.t.length ? (0.25 + 0.75 * Math.log1p(f.t.length) / Math.log1p(max)).toFixed(2) : 0;
        html += `<button class="cell${f.t.length ? "" : " none"}" data-i="${f.i}" style="${f.t.length ? `opacity:${op}` : ""}" aria-label="${esc(qual(f.k))}"></button>`;
      }
      html += `</div></div>`;
    }
    html += `</div></div>`;
  }
  $("#pkgs").innerHTML = html;
  const tip = $("#tip");
  $("#pkgs").addEventListener("mousemove", e => {
    const c = e.target.closest(".cell");
    if (!c) { tip.hidden = true; return; }
    const f = F[+c.dataset.i];
    tip.textContent = `${qual(f.k)}  ·  ${f.t.length} tests`;
    tip.hidden = false;
    const x = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px";
  });
  $("#pkgs").addEventListener("mouseleave", () => tip.hidden = true);
  $("#pkgs").addEventListener("click", e => {
    const c = e.target.closest(".cell");
    if (!c) return;
    const i = +c.dataset.i;
    if (e.shiftKey || e.metaKey || e.ctrlKey) toggleTarget(i); else select(i);
  });
}

// confidence kept along an arrow followed backwards, as 'impact --graph' scores it
function weight(caller, callee) {
  const graph = D.graph, kind = ekind.get(caller + ">" + callee);
  if (!graph) return 1;
  return !kind ? graph.step : graph.step * graph.static * (kind === "calls_by_name" ? graph.guess : 1);
}
function compute() {
  const targets = [...S.targets];
  const seen = new Set(targets), layers = [], conf = new Map(targets.map(i => [i, 1]));
  let frontier = targets.filter(i => !F[i].mod);
  for (let d = 0; d < S.depth && frontier.length; d++) {
    const nxt = [];
    for (const i of frontier) for (const c of up[i]) {
      const strength = conf.get(i) * weight(c, i);
      if (D.graph && strength < D.graph.cutoff) continue;
      if (!seen.has(c)) { seen.add(c); nxt.push(c); }
      if (strength > (conf.get(c) || 0)) conf.set(c, strength);
    }
    if (!nxt.length) break;
    layers.push(nxt); frontier = nxt;
  }
  const tests = new Set();
  for (const i of targets) for (const t of F[i].t) tests.add(t);
  for (const tf of S.testFiles) D.tests.forEach(([t], j) => { if (t.startsWith(tf)) tests.add(j); });
  const untested = targets.filter(i => !F[i].mod && !F[i].t.length);
  return {targets, layers, tests: [...tests], untested, conf};
}

function render() {
  const r = compute(), on = S.targets.size > 0 || S.testFiles.length > 0;
  const state = new Map();
  r.targets.forEach(i => state.set(i, 0));
  r.layers.forEach((l, d) => l.forEach(i => state.set(i, d + 1 > 2 ? 2 : d + 1)));
  // a <module level> change lights the module, not a cell
  const hotFiles = new Set(r.targets.map(i => file(F[i].k))), warmFiles = new Set(r.layers.flat().map(i => file(F[i].k)));
  $("#map").classList.toggle("impact-on", on);
  for (const c of document.querySelectorAll(".cell")) {
    const i = +c.dataset.i, s = state.get(i);
    c.classList.remove("c0", "c1", "c2");
    if (s !== undefined) c.classList.add("c" + s);
    c.classList.toggle("sel", i === S.sel);
  }
  for (const m of document.querySelectorAll(".mod")) {
    const fl = m.dataset.file;
    m.classList.toggle("hot", on && hotFiles.has(fl));
    m.classList.toggle("warm", on && !hotFiles.has(fl) && warmFiles.has(fl));
    m.classList.toggle("dim", on && !hotFiles.has(fl) && !warmFiles.has(fl));
  }
  const graph = S.view === "graph", readableView = graph && S.gview !== "change";
  $("#pkgs").hidden = graph; $("#graph").hidden = !graph || readableView; $("#rg").hidden = !readableView;
  $("#gsub").hidden = !graph;
  for (const b of document.querySelectorAll("[data-view]")) b.classList.toggle("on", b.dataset.view === S.view);
  for (const b of document.querySelectorAll("[data-gview]")) b.classList.toggle("on", b.dataset.gview === S.gview);
  if (graph && !readableView) drawGraph(r, on, state);
  if (readableView) drawReadable();
  $("#legend").innerHTML = readableView ? readableLegend() : graph
    ? (on ? `<span><i style="background:var(--accent)"></i>test files that run the change</span><span><i style="background:var(--chg)"></i>changed</span><span><i style="background:var(--l1)"></i>direct callers</span><span><i style="background:var(--l2)"></i>callers of callers</span>${D.graph ? `<span><i style="border:1.5px dashed var(--l1);background:none"></i>seen only in source (no test runs it)</span><span><i style="border:2.5px solid var(--l1);background:none"></i>public: package users call it</span><span>Numbers: how sure the graph is that the change reaches it</span>` : ""}<span>Arrows point from a function to its callers. Hover to trace, click to inspect, shift-click to add or remove</span>` : "")
    : on
    ? `<span><i style="background:var(--chg)"></i>changed</span><span><i style="background:var(--l1)"></i>direct callers</span><span><i style="background:var(--l2)"></i>callers of callers${S.depth > 2 ? " and up" : ""}</span><span><i style="background:var(--empty)"></i>not reached</span><span>Shift-click a cell to add or remove it from the change</span>`
    : `<span><i style="background:var(--heat)"></i>run by tests (darker = more tests)</span><span><i style="box-shadow:inset 0 0 0 1px var(--empty)"></i>no test runs it</span><span>Click a cell to inspect it, shift-click to add it to a change</span>`;
  renderImpact(r, on);
  renderFn();
  renderExamples();
}

function renderImpact(r, on) {
  const el = $("#impact");
  const staleNote = S.stale.length ? `<p class="warn">${S.stale.length} library file${S.stale.length > 1 ? "s" : ""} changed since the memory was traced. Run <code>repomap refresh</code> after you're done to fold them in.</p>` : "";
  if (!on) {
    el.innerHTML = `<h2>Impact</h2><p class="note">${S.source === "mine" ? "No changes to library or test code since the memory was traced." : "Nothing picked yet."} Pick functions to see what depends on them and which tests run them: search above, shift-click cells, or ${live ? "press <b>My uncommitted changes</b>" : "load the changes saved with this page"}.</p>${staleNote}`;
    return;
  }
  const label = S.source === "example" ? `Example: ${esc(S.ex.title)}${S.picked ? ", plus picked functions" : ""}` : (S.source === "mine" ? "Your uncommitted changes" : S.source === "export" ? "Changes when this page was exported" : "Picked functions") + (S.picked && S.source !== "picked" ? ", plus picked functions" : "");
  const callers = r.layers.flat();
  const mods = new Set(callers.map(i => modName(F[i].k)));
  let h = `<h2>Impact</h2><div class="note">${label}</div>
  <div class="big"><div><b>${r.targets.length + S.testFiles.length}</b><span>changed</span></div>
  <div><b>${callers.length}</b><span>callers in ${mods.size} module${mods.size === 1 ? "" : "s"}</span></div>
  <div><b>${r.tests.length}</b><span>of ${D.tests.length} tests (${(100 * r.tests.length / D.tests.length).toFixed(1)}%)</span></div></div>`;
  h += `<div class="sec"><h5>Changed</h5>${r.targets.map(i => chip(i, "")).join("")}${S.testFiles.map(tf => `<span class="chip l2"><span class="nm">${esc(tf)}</span><span class="tag">test file</span></span>`).join("")}
    ${S.unknown.length ? `<p class="note">New code the memory hasn't traced yet: ${S.unknown.map(esc).join(", ")}</p>` : ""}</div>`;
  h += `<div class="sec"><h5>Callers <span class="depth" role="group" aria-label="Caller depth">${[1, 2, 3, 4].map(d => `<button data-depth="${d}" class="${d === S.depth ? "on" : ""}">${d}</button>`).join("")}</span></h5>`;
  if (!r.layers.length) h += `<p class="note">Nothing in the package calls ${r.targets.length > 1 ? "these" : "this"}${r.untested.length ? "" : "; only tests do"}.</p>`;
  r.layers.forEach((l, d) => {
    const g = new Map();
    for (const i of l) { const m = modName(F[i].k); if (!g.has(m)) g.set(m, []); g.get(m).push(i); }
    h += `<div class="tag" style="margin:4px 0 3px">${d === 0 ? "Direct callers" : `Level ${d + 1}`}</div>`;
    for (const [m, is] of [...g].sort()) {
      const shown = is.slice(0, 8);
      h += `<div class="modrow"><b>${esc(m)}</b> ${shown.map(i => `<button class="link mono" data-sel="${i}">${esc(short(F[i].k))}</button>`).join(", ")}${is.length > 8 ? ` <span class="note">+${is.length - 8} more</span>` : ""}</div>`;
    }
  });
  h += `</div>`;
  const byFile = new Map();
  for (const t of r.tests) { const f = D.tests[t][0].split("::")[0]; byFile.set(f, (byFile.get(f) || 0) + 1); }
  const files = [...byFile].sort((a, b) => b[1] - a[1]);
  if (S.source === "example" && !S.picked) {
    const broke = new Set(S.ex.broke), sel = new Set(r.tests.map(t => D.tests[t][0]));
    const missed = S.ex.broke.filter(t => !sel.has(t));
    h += `<div class="sec"><h5>Tests that run it <span>${r.tests.length} of ${D.tests.length}</span></h5><ul class="plain">${[...sel].sort().map(t => `<li><span>${esc(t)}</span><span class="st ${broke.has(t) ? "broke" : "passed"}">${broke.has(t) ? "broke" : "passed"}</span></li>`).join("")}</ul>
    <p class="verdict">${S.ex.broke.length === 0 ? "We made this edit and ran the whole suite: nothing broke." : `We made this edit and ran the whole suite: ${S.ex.broke.length} test${S.ex.broke.length > 1 ? "s" : ""} broke, ${missed.length ? `and ${missed.length} of them ${missed.length > 1 ? "were" : "was"} <b>not</b> selected: ${missed.map(esc).join(", ")}` : `all of ${S.ex.broke.length > 1 ? "them" : "it"} selected above`}.`}${r.tests.length > S.ex.broke.length ? ` The ones marked passed run the changed code but don't depend on the detail that changed.` : ""}</p>`;
  } else h += `<div class="sec"><h5>Tests that run it <span>${r.tests.length}</span></h5><ul class="plain">${files.slice(0, 12).map(([f, n]) => `<li><span>${esc(f)}</span><span>${n}</span></li>`).join("")}</ul>${files.length > 12 ? `<p class="note">+${files.length - 12} more files</p>` : ""}`;
  if (r.untested.length) h += `<p class="warn">No test runs ${r.untested.map(i => `<code>${esc(short(F[i].k))}</code>`).join(", ")}, so nothing in the memory can say what depends on ${r.untested.length > 1 ? "them" : "it"} at run time.</p>`;
  if (r.tests.length) {
    const ids = [...new Set(r.tests.map(t => D.tests[t][0].split("[")[0]))].sort();
    const sel = r.tests.length < 40 ? ids : files.map(f => f[0]).sort();
    const cmd = `python -m pytest -q ${sel.slice(0, 40).join(" ")}${sel.length > 40 ? " …" : ""}`;
    h += `<div class="row" style="margin-top:8px;justify-content:space-between"><span class="tag">Run them</span><button id="copy">Copy command</button></div><pre class="cmd" id="cmd">${esc(cmd)}</pre>`;
  }
  h += `</div>${staleNote}`;

}

function chip(i, cls) {
  const f = F[i];
  return `<span class="chip ${cls}"><span class="nm" data-sel="${i}">${esc(f.mod ? f.k : short(f.k))}</span><span class="tag">${f.t.length}</span><button data-rm="${i}" aria-label="Remove from change">×</button></span>`;
}

function summ(s) {
  if (!s) return "";
  const types = Object.entries(s.types || {}).sort((a, b) => b[1] - a[1]).map(([t, n]) => `${t}×${n}`).join(", ");
  const flags = Object.entries(s.flags || {}).sort().map(([f, n]) => `${f}×${n}`).join(", ");
  const gaps = [];
  for (const t of Object.keys(s.types || {})) for (const g of PROBES[t] || []) if (!(s.flags || {})[g] && !gaps.includes(g)) gaps.push(g);
  return `${esc(types || "never seen")}${flags ? ` <span class="tag">[${esc(flags)}]</span>` : ""}${gaps.length ? `<div class="gap">never ${gaps.join(", ")}</div>` : ""}`;
}

function renderFn() {
  const el = $("#fn");
  if (S.sel === null) { el.hidden = true; return; }
  el.hidden = false;
  const f = F[S.sel], v = f.v, ins = S.targets.has(f.i);
  const callers = [...new Set(up[f.i])], callees = [...new Set(down[f.i])];
  const col = (is, side) => is.slice(0, 8).map(i => `<button class="link n" data-sel="${i}">${esc(short(F[i].k))}</button>`).join("") + (is.length > 8 ? `<span class="note">+${is.length - 8} more</span>` : "") || `<span class="note">${side === "l" ? "only tests" : "nothing in the package"}</span>`;
  let h = `<h2>Function</h2><div class="fnkey">${esc(qual(f.k))}</div>
  <div class="note mono">${esc(D.package.replace(/[^/]+$/, ""))}${esc(file(f.k))}${f.s ? `:${f.s}–${f.e}` : ""}</div>
  <div class="row" style="margin:10px 0 4px"><button id="toggle" class="${ins ? "" : "primary"}">${ins ? "Remove from change" : "What if I change this?"}</button>
  <span class="note">${f.t.length} tests run it${v ? ` · ${v.calls.toLocaleString()} calls traced` : ""}</span></div>`;
  h += `<div class="sec"><h5><span>Called by</span><span>Calls</span></h5><div class="nb"><div class="col l">${col(callers, "l")}</div><div class="me">${esc(short(f.k).split(".").slice(-2).join("."))}</div><div class="col r">${col(callees, "r")}</div></div></div>`;
  if (v) {
    const rows = Object.entries(v.args || {}).map(([a, s]) => `<tr><td>${esc(a)}</td><td>${summ(s)}</td></tr>`);
    rows.push(`<tr><td>returns</td><td>${summ(v.returns)}</td></tr>`);
    const rz = Object.entries(v.raises || {});
    if (rz.length) rows.push(`<tr><td>raises</td><td>${rz.map(([e, n]) => `${esc(e)}×${n}`).join(", ")}</td></tr>`);
    h += `<div class="sec"><h5>Values the tests passed in <span>first 30 calls per test</span></h5><table class="vals">${rows.join("")}</table></div>`;
  } else if (!f.mod) {
    h += `<div class="sec"><p class="note">No test ran this function, so there are no recorded values.</p></div>`;
  }
  if (f.t.length) {
    const names = f.t.slice(0, 10).map(t => D.tests[t][0]);
    h += `<div class="sec"><h5>Tests <span>${f.t.length}</span></h5><ul class="plain">${names.map(n => `<li><span>${esc(n)}</span><span></span></li>`).join("")}</ul>${f.t.length > 10 ? `<p class="note">+${f.t.length - 10} more</p>` : ""}</div>`;
  }
  el.innerHTML = h;
}

function renderExamples() {
  const el = $("#examples-card");
  if (!S.examples.length) return;
  const ex = S.ex;
  const diff = ex ? ex.diff.split("\n").filter(l => /^[-+@ ]/.test(l) && !/^(---|\+\+\+)/.test(l)).map(l => `<span class="${l[0] === "+" ? "add" : l[0] === "-" ? "del" : ""}">${esc(l)}</span>`).join("\n") : "";
  el.innerHTML = `<h2>Examples</h2><div class="exlist">${S.examples.map((x, j) => `<button data-ex="${j}" class="${x === ex && S.source === "example" ? "on" : ""}">${esc(x.title)}</button>`).join("")}</div>
  ${ex && S.source === "example" ? `<p class="note" style="margin:6px 0 0">${esc(ex.blurb)}</p><pre class="diff">${esc(ex.file)}\n${diff}</pre>` : `<p class="note">Pick an example edit to see what it reaches and which tests really broke.</p>`}`;
}
function useExample(j) {
  const ex = S.examples[j];
  S.ex = ex; S.source = "example"; S.picked = false; S.testFiles = []; S.unknown = [];
  S.targets = new Set(ex.changed.map(k => byKey.get(k)).filter(i => i !== undefined));
  S.sel = null;
}

function select(i) {
  S.sel = i; render();
  const fn = $("#fn"), side = $("aside");
  if (innerWidth <= 980) fn.scrollIntoView({behavior: "smooth", block: "start"});
  else side.scrollTo({top: Math.min(fn.offsetTop, Math.max(side.scrollTop, fn.offsetTop + fn.offsetHeight - side.clientHeight)), behavior: "smooth"});
}
function toggleTarget(i) {
  S.targets.has(i) ? S.targets.delete(i) : S.targets.add(i);
  if (S.source === "mine" || S.source === "export" || S.source === "example") S.picked = true; else S.source = "picked";
  render();
}
function applyChanges(res) {
  S.targets = new Set(); S.unknown = [];
  for (const k of res.changed) { const i = byKey.get(k); if (i === undefined) S.unknown.push(k); else S.targets.add(i); }
  S.testFiles = res.test_files || []; S.stale = res.files_changed_since_record || S.stale;
  S.source = live ? "mine" : "export"; S.picked = false;
}
async function loadMine(quiet) {
  if (!live) return;
  const b = $("#mine"); b.disabled = true; b.textContent = "Diffing…";
  try {
    const res = await (await fetch("/api/changes")).json();
    if (res.error) throw new Error(res.error);
    if (!quiet || res.changed.length || res.test_files.length) applyChanges(res);
    else S.stale = res.files_changed_since_record;
    if (!quiet && !res.changed.length && !res.test_files.length) S.source = "mine";
  } catch (e) { if (!quiet) $("#impact").innerHTML = `<h2>Impact</h2><p class="err">${esc(e.message)}</p>`; }
  b.disabled = false; b.textContent = "My uncommitted changes";
}

document.addEventListener("click", async e => {
  const t = e.target;
  if (t.closest("#results") || t.closest(".cell")) return;
  if (t.dataset.sel !== undefined) select(+t.dataset.sel);
  else if (t.dataset.rm !== undefined) { S.targets.delete(+t.dataset.rm); render(); }
  else if (t.dataset.ex !== undefined) { useExample(+t.dataset.ex); render(); }
  else if (t.dataset.depth) { S.depth = +t.dataset.depth; render(); }
  else if (t.dataset.view) { S.view = t.dataset.view; try { localStorage.setItem("repomap.view", S.view); } catch {} render(); }
  else if (t.dataset.gview) { S.gview = t.dataset.gview; try { localStorage.setItem("repomap.gview", S.gview); } catch {} render(); }
  else if (t.id === "toggle") toggleTarget(S.sel);
  else if (t.id === "clear") { S.targets.clear(); S.testFiles = []; S.unknown = []; S.source = null; S.picked = false; S.sel = null; render(); }
  else if (t.id === "mine") { if (live) { await loadMine(false); render(); } else { applyChanges(JSON.parse($("#embedded").textContent).changes); render(); } }
  else if (t.id === "copy") {
    const txt = $("#cmd").textContent;
    try { await navigator.clipboard.writeText(txt); t.textContent = "Copied"; }
    catch { const r = document.createRange(); r.selectNodeContents($("#cmd")); getSelection().removeAllRanges(); getSelection().addRange(r); t.textContent = "Selected, press Ctrl-C"; }
    setTimeout(() => t.textContent = "Copy command", 1600);
  }
  if (!t.closest(".search")) $("#results").hidden = true;
});

let hits = [], hi = 0;
function search(q) {
  q = q.trim();
  const m = q.match(/^(.+\.py):(\d+)$/);
  if (m) {
    const n = +m[2], path = m[1].replace(/^.*?(?=[^/]+\/)/, "");
    const cands = F.filter(f => !f.mod && (path.endsWith(file(f.k)) || file(f.k).endsWith(m[1].replace(/^src\//, ""))) && f.s <= n && n <= f.e);
    return cands.sort((a, b) => (a.e - a.s) - (b.e - b.s)).slice(0, 1);
  }
  const lq = q.toLowerCase();
  return F.filter(f => !f.mod && f.k.toLowerCase().includes(lq))
    .sort((a, b) => (qual(a.k).toLowerCase().endsWith(lq) ? 0 : 1) - (qual(b.k).toLowerCase().endsWith(lq) ? 0 : 1) || b.t.length - a.t.length).slice(0, 14);
}
function showHits() {
  const r = $("#results");
  if (!hits.length) { r.innerHTML = `<div class="note" style="padding:8px 10px">No function matches.</div>`; r.hidden = false; return; }
  r.innerHTML = hits.map((f, j) => `<button data-hit="${j}" class="${j === hi ? "on" : ""}">${esc(qual(f.k))}<small>${esc(file(f.k))}:${f.s} · ${f.t.length} tests</small></button>`).join("");
  r.hidden = false;
}
$("#q").addEventListener("input", e => { const q = e.target.value; if (q.trim().length < 2) { $("#results").hidden = true; return; } hits = search(q); hi = 0; showHits(); });

function graphTrace(id) {
  const svg = $("#graph svg");

  const start = G.nodes[id], on = new Set([start]), onE = new Set();
  for (const dir of [1, -1]) {  // walk outwards in both directions, never doubling back
    let front = [start];
    while (front.length) {
      const nxt = [];
      G.edges.forEach((e, j) => {
        const [from, to] = dir === 1 ? [e.a, e.b] : [e.b, e.a];
        if (front.includes(from)) { onE.add(j); if (!on.has(to)) { on.add(to); nxt.push(to); } }
      });
      front = nxt;
    }
  }
  svg.classList.add("fade");
  for (const g of svg.querySelectorAll(".gn")) g.classList.toggle("hl", on.has(G.nodes[+g.dataset.n]));

  drawLinks();
  const historySel = live ? `<select id="rgsince">${WINDOWS.map(([k, label]) => `<option value="${k}"${k === R.since ? " selected" : ""}>${label}</option>`).join("")}</select>` : `<span class="note">${esc(X.since)}</span>`;
  $("#rgbar").innerHTML = `<label>Layout <select id="rglayout"><option value="folders"${R.layout === "folders" ? " selected" : ""}>Folders</option><option value="coupling"${R.layout === "coupling" ? " selected" : ""}>Coupling groups</option></select></label>
    ${nbView ? "" : `<label>Shade by <select id="rgshade">${Object.entries(SHADES).map(([k, label]) => `<option value="${k}"${k === R.shade ? " selected" : ""}>${label}</option>`).join("")}</select></label>`}
    <label><input type="checkbox" id="rglm"${R.lm ? " checked" : ""}> Landmarks</label>
    <label><input type="checkbox" id="rgun"${R.un ? " checked" : ""}> Untested code</label>
    ${nbView ? "" : `<label><input type="checkbox" id="rglinks"${R.links ? " checked" : ""}> Calls between functions</label>
    <label><input type="checkbox" id="rgpace"${R.pace ? " checked" : ""}> Fast and slow parts</label>
    <label>History ${historySel}</label>
    <span class="note">${X.commits} commit${X.commits === 1 ? "" : "s"} in this window${R.loading ? " · loading…" : ""}</span>`}
    ${nbView ? `<span class="note">${me ? `${ins.size} call it · it calls ${outs.size}` : "Click a function to see who calls it and what it calls."}</span>` : ""}`;
}

function readableLegend() {
  if (!R.data) return "";
  if (S.gview === "replay") return `<span><i style="background:var(--chg)"></i>this step</span><span><i style="background:color-mix(in srgb, var(--accent) 55%, var(--panel))"></i>already called</span><span><i style="background:var(--empty)"></i>called later in this test</span><span>Lines follow each call from caller to callee. Click a bar in the tree to jump to that call</span>`;
  if (S.gview === "neighborhood") return `<span><i style="background:var(--fg)"></i>picked function</span><span><i style="background:var(--accent)"></i>calls it</span><span><i style="background:var(--l1)"></i>it calls</span><span><i style="border-top:2px dashed var(--muted);height:0;border-radius:0"></i>seen only in source</span>` +
    (R.un ? `<span><i style="background:var(--un-soft);border:1px dashed var(--un)"></i>no test runs it</span>` : "") + `<span>The panel on the right shows the values it saw</span>`;
  return `<span><i style="background:var(--heat)"></i>darker = more ${esc(SHADES[R.shade])}</span>` +
    (R.un ? `<span><i style="background:var(--un-soft);border:1px dashed var(--un)"></i>no test runs it</span>` : "") +
    (R.pace ? `<span><i style="border:2px solid var(--fast)"></i>changed often</span><span><i style="border:2px solid var(--slow)"></i>slow: ${R.data.slow_floor}+ dependents, unchanged</span>` : "") +
    (R.lm ? `<span><i style="background:var(--fg);border-radius:50%"></i>landmark: most code runs under it</span>` : "") +
    (R.links ? `<span><i style="border-top:1.5px solid var(--muted);height:0;border-radius:0"></i>a call (hover a cell to pick out its calls)</span>` : "") +
    `<span>Scroll to zoom, drag to pan, click a cell to inspect it</span>`;
}

function readableTip(e, d) {
  const tip = $("#tip"), f = R.data.fields;
  tip.style.whiteSpace = "pre";
  tip.textContent = `${d.k}\n` + ["references", "tests", "calls", "reach", "dependents", "changes"].map(k => `${k.padEnd(11)}${d.u.n[f.indexOf(k)]}`).join("\n") +
    `\npace       ${num(d.u, "pace")}${num(d.u, "tested") ? "" : "\nno test runs it"}`;
  tip.hidden = false; moveTip(e);
}
function moveTip(e) {
  const tip = $("#tip");
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY + 14) + "px";
}
$("#rgbar").addEventListener("change", e => {
  const t = e.target;
  if (t.id === "rgshade") R.shade = t.value;
  else if (t.id === "rglm") R.lm = t.checked;
  else if (t.id === "rgun") R.un = t.checked;
  else if (t.id === "rgpace") R.pace = t.checked;
  else if (t.id === "rglinks") R.links = t.checked;
  else if (t.id === "rglayout") R.layout = t.value;
  else if (t.id === "rgsince") R.since = t.value;
  else if (t.id === "rptest") { if (RP.tests && RP.tests.some(([name]) => name === t.value)) { stopPlay(); loadRun(t.value); } return; }
  saveR(); render();
});

// ---------- test replay: one test's calls in the order they ran, with the values that passed between them ----------
const RP = {tests: null, test: null, run: null, step: 0, timer: null};
const unitOf = k => pageKey(k.includes(".<locals>.") ? k.split(".<locals>.")[0] : k);
const shortCall = k => short(unitOf(k)).split(".").slice(-2).join(".");
const showVal = v => v ? (v.repr === null || v.repr === undefined ? `<${v.type}>` : v.repr) : "";

async function loadTests() {
  if (RP.tests) return;
  RP.tests = live ? (await (await fetch("/api/replay")).json()) || [] :
    Object.values(D.replay || {}).map(run => [run.test, run.steps, run.truncated]);
  if (!RP.test && RP.tests.length) {  // start with the test that runs the most code
    const best = [...RP.tests].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1))[0][0];
    await loadRun(best, true);
  }
  render();
}
async function loadRun(test, quiet) {
  RP.test = test; RP.step = 0;
  RP.run = live ? await (await fetch("/api/replay?test=" + encodeURIComponent(test))).json() : (D.replay || {})[test];
  if (!quiet) render();
}

function styleReplay() {
  const svg = R.svg.node();
  svg.classList.remove("nbmode"); svg.classList.add("rpmode"); $("#rp").hidden = false;
  if (!RP.tests) { loadTests(); $("#rgbar").innerHTML = `<span class="note">Loading the recorded tests…</span>`; return; }
  if (!RP.tests.length) {
    $("#rgbar").innerHTML = `<span class="note">${live || D.replay !== null ? "No call order was recorded. Run <code>repomap record</code> (with --steps above 0), then <code>repomap graph update</code>." : "This page was exported without test replays (too many recorded calls). Use <code>repomap serve</code> to replay tests."}</span>`;
    $("#rpstep").innerHTML = ""; d3.select("#rptree").selectAll("*").remove(); return;
  }
  const rows = RP.run ? RP.run.rows : [], step = Math.min(RP.step, Math.max(rows.length - 1, 0));
  const byUnit = k => R.byIndex.get(byKey.get(unitOf(k)));
  const ran = new Set(rows.map(r => byUnit(r.function)).filter(Boolean));
  const seen = new Set(rows.slice(0, step).map(r => byUnit(r.function)).filter(Boolean));
  const now = rows.length ? byUnit(rows[step].function) : null;
  R.cells.attr("class", d => `rc s0${d === now ? " cur" : seen.has(d) ? " vis" : ran.has(d) ? " run" : ""}${num(d.u, "tested") ? "" : " un"}`);
  // the calls made so far, from caller to callee; the current one stands out
  const links = [];
  rows.slice(0, step + 1).forEach((r, k) => {
    if (r.parent_seq === null || r.parent_seq === undefined) return;
    const a = byUnit(rows[r.parent_seq].function), b = byUnit(r.function);
    if (a && b && a !== b) links.push({a, b, cls: k === step ? "now" : "trail"});
  });
  R.linkLayer.selectAll("path").data(links).join("path").attr("class", d => `rlk ${d.cls}`).attr("d", d => curve(d.a, d.b));
  const truncated = RP.run && RP.run.truncated;
  $("#rgbar").innerHTML = `<label>Test <input id="rptest" list="rptests" value="${esc(RP.test || "")}" aria-label="Test to replay"></label>
    <datalist id="rptests">${RP.tests.map(([name]) => `<option value="${esc(name)}">`).join("")}</datalist>
    <span class="row"><button id="rpback" aria-label="Previous call">Back</button><button id="rpplay" class="primary">${RP.timer ? "Pause" : "Play"}</button><button id="rpnext" aria-label="Next call">Next</button></span>
    <span class="note">call ${rows.length ? step + 1 : 0} of ${rows.length}${truncated ? " · recording stopped here (the cap on steps per test)" : ""}</span>`;
  if (!rows.length) { $("#rpstep").innerHTML = `<span class="note">This test called nothing in the package.</span>`; d3.select("#rptree").selectAll("*").remove(); return; }
  const r = rows[step], caller = r.parent_seq === null || r.parent_seq === undefined ? "the test" : shortCall(rows[r.parent_seq].function);
  const args = Object.entries(r.args || {}).map(([name, v]) => `${esc(name)}=<span class="val">${esc(showVal(v))}</span>`).join(", ");
  $("#rpstep").innerHTML = `<div class="call">${esc(caller)} → <b>${esc(shortCall(r.function))}</b>(${args})</div>
    <div class="call">${r.raised ? `raised <span class="val">${esc(r.raised)}</span>` : `returned <span class="val">${esc(showVal(r.ret))}</span>`}</div>
    <div class="note mono">${esc(r.function)}</div>`;
  drawTree(rows, step);
}

function drawTree(rows, step) {
  const kids = rows.map(() => []), roots = [];
  rows.forEach((r, k) => (r.parent_seq === null || r.parent_seq === undefined ? roots : kids[r.parent_seq]).push(k));
  const leaves = rows.map(() => 0);
  for (let k = rows.length - 1; k >= 0; k--) leaves[k] = kids[k].length ? kids[k].reduce((s, c) => s + leaves[c], 0) : 1;
  const depth = rows.map(r => r.depth), maxD = Math.max(1, ...depth), total = roots.reduce((s, k) => s + leaves[k], 0) || 1;
  const W = 1000, RH = 20, top = 16, H = top + maxD * RH + 4, x0 = [];
  let cur = 0;
  for (const k of roots) { x0[k] = cur; cur += leaves[k]; }
  rows.forEach((r, k) => { let c = x0[k]; for (const ch of kids[k]) { x0[ch] = c; c += leaves[ch]; } });
  const sx = W / total, tree = d3.select("#rptree").attr("viewBox", `0 0 ${W} ${H}`);
  tree.selectAll(".rpaxis").data([0]).join("text").attr("class", "rpaxis").attr("x", 0).attr("y", 11).text("time runs left to right · each row is called by the row above");
  const g = tree.selectAll("g.bars").data([0]).join("g").attr("class", "bars");
  const bars = g.selectAll("g.bar").data(rows.map((r, k) => ({r, k}))).join(enter => {
    const e = enter.append("g").attr("class", "bar");
    e.append("rect").attr("class", "rpb").on("click", (ev, d) => { stopPlay(); RP.step = d.k; render(); });
    e.append("text").attr("class", "rpt");
    e.append("title");
    return e;
  });
  bars.select("rect").attr("x", d => x0[d.k] * sx).attr("y", d => top + (depth[d.k] - 1) * RH).attr("width", d => Math.max(leaves[d.k] * sx - 1, 1)).attr("height", RH - 2)
    .attr("class", d => `rpb${d.k === step ? " cur" : d.k < step ? " vis" : ""}`);
  bars.select("text").attr("x", d => x0[d.k] * sx + 3).attr("y", d => top + (depth[d.k] - 1) * RH + 13)
    .text(d => { const w = leaves[d.k] * sx; return w > 34 ? shortCall(d.r.function).slice(0, Math.floor((w - 6) / 6)) : ""; });
  bars.select("title").text(d => `${d.k + 1}. ${d.r.function}`);
}

function stopPlay() { if (RP.timer) { clearInterval(RP.timer); RP.timer = null; } }
function stepBy(n) { const rows = RP.run ? RP.run.rows : []; RP.step = Math.max(0, Math.min(rows.length - 1, RP.step + n)); render(); }
$("#rgbar").addEventListener("click", e => {
  const id = e.target.id;
  if (id === "rpback") { stopPlay(); stepBy(-1); }
  else if (id === "rpnext") { stopPlay(); stepBy(1); }
  else if (id === "rpplay") {
    if (RP.timer) { stopPlay(); render(); return; }
    if (RP.run && RP.step >= RP.run.rows.length - 1) RP.step = 0;
    RP.timer = setInterval(() => { if (!RP.run || RP.step >= RP.run.rows.length - 1 || S.gview !== "replay") { stopPlay(); render(); } else stepBy(1); }, 650);
    render();
  }
});

boot();
</script>
</body>
</html>
