[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repomap"
dynamic = ["version"]
description = "Remember what your test suite runs, then ask what a change will touch and which tests to run, without running anything."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["testing", "pytest", "test-selection", "change-impact"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
repomap = "repomap.cli:main"

[project.urls]
Homepage = "https://github.com/AndrewTaoWen/devex-lab/tree/main/devtools/cli"

[tool.setuptools.dynamic]
version = { attr = "repomap.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repomap = ["ui.html", "_plugin/*.py"]
